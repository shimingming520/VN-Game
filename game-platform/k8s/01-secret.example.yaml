# 敏感配置模板 —— 复制为 01-secret.yaml 并填入真实值,01-secret.yaml 不要提交 git
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: agent-platform
type: Opaque
stringData:
  # 172.16.50.17 上新建的平台库(与业务库 extreme 同实例不同库)
  # 分段填,密码写原文即可,程序自动做 URL 转义(见 common/config.py),
  # 不用手动处理密码里 @ 等特殊字符的转义
  PLATFORM_DB_HOST: "172.16.50.17"
  PLATFORM_DB_PORT: "5432"
  PLATFORM_DB_NAME: "agent_platform"
  PLATFORM_DB_USER: "PLATFORM_USER"
  PLATFORM_DB_PASSWORD: "PLATFORM_PWD"
  # 集群内 rabbitmq 服务;账号在 03-rabbitmq.yaml 的 RABBITMQ_DEFAULT_USER/PASS 定义
  PLATFORM_MQ_URL: "amqp://platform:MQ_PWD@rabbitmq.agent-platform.svc.cluster.local:5672/%2F"
  # rabbitmq 自建账号密码(03-rabbitmq.yaml 引用;须与上面 MQ_PWD 一致)
  RABBITMQ_PASSWORD: "MQ_PWD"
  # 主站 OAuth 应用密钥(阶段4;MAINSITE_MOCK=1 时可留空)
  MAINSITE_CLIENT_SECRET: ""
  # 平台自签 JWT 的密钥,生产环境务必换成随机长串
  PLATFORM_JWT_SECRET: "CHANGE_ME_RANDOM_LONG_STRING"
  # oauth_token 落库加密密钥(Fernet key;生成: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
  TOKEN_ENCRYPT_KEY: "CHANGE_ME_FERNET_KEY"
  # 内部服务令牌(novel-game-factory api_gateway 调平台 POST /api/v1/tasks 用;
  # 须与 novel-game-factory secret-test.yaml 的 PLATFORM_SERVICE_TOKEN 一致)
  PLATFORM_SERVICE_TOKEN: "CHANGE_ME_RANDOM_TOKEN"
  # CMS 管理后台 API token(发布游戏用;登录链路打通前的临时方案)
  CMS_API_TOKEN: ""
