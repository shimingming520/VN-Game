content: |
  Based on the following novel content excerpt, generate an appealing web novel title:
  
  Content excerpt:
  {combined_content}
  
  Requirements:
  - The title should reflect the core characteristics and theme of the story
  - Use popular web novel title styles
  - Keep it within 3-8 words
  - Avoid special characters
  - Make it attractive and commercially viable
  - Do not use the original title
  
