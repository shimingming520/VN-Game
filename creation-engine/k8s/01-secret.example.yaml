# 敏感配置模板 —— 复制为 01-secret.yaml 并填入真实值,01-secret.yaml 不要提交 git
apiVersion: v1
kind: Secret
metadata:
  name: engine-secrets
  namespace: agent-platform
type: Opaque
stringData:
  # 与中台共用 agent_platform 库；复用 platform_user/novel_tasks，OAuth token 使用
  # 创作引擎独立的 creation_engine_oauth_token 表，避免不同加密密钥互相覆盖。
  PLATFORM_DB_HOST: "172.16.50.17"
  PLATFORM_DB_PORT: "5432"
  PLATFORM_DB_NAME: "agent_platform"
  PLATFORM_DB_USER: "PLATFORM_USER"
  PLATFORM_DB_PASSWORD: "PLATFORM_PWD"
  # 创作引擎独立 CMS OAuth2 应用密钥(client_id 见 configmap)
  MAINSITE_CLIENT_SECRET: "sec_5w9H9iDsfNzoAzTGghtIKRA64A8MFf_buHsXJSy_oqQ"
  # 创作引擎自签 JWT 密钥,生产环境务必换成随机长串(与中台 PLATFORM_JWT_SECRET 可不同)
  PLATFORM_JWT_SECRET: "CHANGE_ME_RANDOM_LONG_STRING"
  # oauth_token 落库加密密钥(Fernet key;生成: python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
  TOKEN_ENCRYPT_KEY: "CHANGE_ME_FERNET_KEY"
  # 内部服务令牌:创作代理回落到服务令牌模式时带给中台的凭证,须与中台
  # game-platform k8s/01-secret.yaml 的 PLATFORM_SERVICE_TOKEN 同值。
  # 真实值不写进仓库,部署时注入;留空则代理只走「转发用户 Authorization」(默认路径)。
  PLATFORM_SERVICE_TOKEN: ""
  # 阿里云百炼(素材名 LLM 翻译用;留空则不调 LLM,前端回落本地词典)
  DASHSCOPE_API_KEY: "CHANGE_ME_DASHSCOPE_KEY"
