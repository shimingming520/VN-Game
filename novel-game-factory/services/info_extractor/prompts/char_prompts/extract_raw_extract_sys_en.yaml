  # Story Tree Data Processing Rules
  
  ## 1. Input Data Structure
  Input is a dictionary, key is node ID, value is character state information in that node.
  Each node contains:
  - character_id: Character ID
  - appearance: Appearance description (skin_texture, facial_features, body_details)
  - clothing: Clothing description (texture, accessories)
  - expression: Expression description (eyes, micro_expression)
  
  ## 2. Special Processing Logic
  - **Node Order**: Process nodes in depth-first traversal order
  - **Timeline Processing**: Each node represents a time point in the story
  - **Feature Inheritance**: If a node doesn't mention a feature, inherit description from previous node
  - **Change Detection**: Compare features of adjacent nodes, detect core changes
  - **Memory State Filtering**: Pay attention to time indicator words in text. Ignore the flashback states of characters who also appear in the current timeline; but extract the memory-time state of a character who ONLY appears inside memory (it is their only canonical state)
  
  ## 3. Correspondence with Basic Rules
  - Story tree node = time point in text
  - Node order = time order
  - Features in director_metadata = states of current narrative timeline
  - When extracting information from markdown body, filter the memory content of characters who also appear in the current timeline; keep the memory-time state of characters who only appear inside memory
  
  # Output Format Requirements
  **Must return a JSON object, key is character name, value is complete data for that character.**
  
  Each character's data must include:
  ```json
  {
    "name": "Character Name",
    "info": "Factual identity and narrative-context summary grounded in this segment",
    "start_line": 12,
    "end_line": 48,
    "other_names": [],
    "personality_variants": [...],
    "whole_body_variants": [...],
    "clothing_variants": [...],
    "valid_status_combinations": [...]
  }
  ```
  
  **Important Requirements**:
  1. Must process multiple characters, don't output only a single character
  2. Each character must have complete data structure as above
  3. Variant IDs start from 1 and are numbered consecutively
  4. If there's not enough information, create empty arrays but still retain data structure
  5. Return JSON directly, don't add any explanatory text
  6. Every returned character and every returned variant/combination must contain `info`, `start_line`, and `end_line`
  
  # Universal Extraction Rules (Apply to All Tasks)
  
  ## Rule 1: Pronoun Coreference Resolution (CRITICAL - Always Perform First)
  **Before extracting any character information, you MUST first analyze all pronouns in the text and determine their referents.**
  
  ### Analysis Process (MANDATORY):
  1. **Identify all pronouns** in the text:
     - English: "he", "she", "him", "her", "his", "hers", "they", "them", "their", "it", "its", etc.
     - Chinese: "他", "她", "它", "他的", "她的", "它的", "他们", "她们", "它们", etc.
  
  2. **Determine referents** for each pronoun by analyzing:
     - Previous character mentions in the same or nearby sentences
     - Gender agreement (e.g., "she" must refer to a female character)
     - Semantic coherence (who performs the action, who is being described)
     - Dialogue attribution (who is speaking)
     - Narrative flow and logical consistency
  
  3. **Create a mental mapping** of pronouns to their referents before proceeding with extraction
  
  4. **Apply this mapping** throughout the extraction process to ensure:
     - Pronouns are NEVER extracted as character names
     - Character features described using pronouns are correctly attributed to the right character
     - Gender inference is based on resolved pronoun references
  
  ### Examples:
  - "楚瑶走进房间。她看到了厉寒霆。" → "她" refers to "楚瑶"
  - "Lestat entered the room. He smiled at Louis." → "He" refers to "Lestat"
  - "The man approached. His face was pale." → "His" refers to "The man" (identify who "The man" is first)
  
  **This pronoun resolution step is mandatory and must be completed before any character extraction begins.**
  
  ## Rule 2: Character Name Preservation
  **Character names must preserve the original language.** If the original text is in English, use English character names (e.g., "Sherlock Holmes"); if in Chinese, use Chinese character names (e.g., "唐三", "小舞"). Absolutely do not translate or transliterate.
  
  For Chinese names, pay special attention to identifying nicknames, pet names, abbreviations, and other variants (e.g., "顾宇" may be nicknamed "小宇", "宇儿", etc.; "张三" may be nicknamed "三儿", "小三", etc.). Judge from context whether these variants refer to the same character; if so, classify them as different names for the same character.
  
  ## Rule 3: Alias Extraction (other_names field) - CRITICAL
  **You MUST extract ALL different ways each character is referred to in the text.**
  
  This includes:
  - Full names vs. shortened names (e.g., "Louis de Pointe du Lac" → "Louis")
  - First name vs. last name (e.g., "John Watson" → "Watson", "John")
  - Names with titles vs. without (e.g., "Dr. Watson" → "Watson", "Father Moreau" → "Moreau")
  - Formal names vs. nicknames (e.g., "William" → "Will", "Bill")
  - Descriptive terms that later resolve to names (e.g., "The stranger" → "Lestat")
  
  **Critical Rule**: If you choose a full name as the primary `name` field (e.g., "Louis de Pointe du Lac"), you MUST include all shorter versions used in the text in `other_names` (e.g., ["Louis"]). Do NOT assume they are "the same name" - they are different textual representations that must be captured.
  
  **Do NOT leave other_names empty** unless the character is truly only referred to by one exact name throughout the entire text.
  
  ### Common Patterns:
  - English: "Paul de Pointe du Lac" → "Paul", "John Watson" → "Watson"/"John", "Dr. Watson"/"Mr. Holmes"
  - Chinese: "顾宇" → "小宇"/"宇儿"/"阿宇", "张三" → "三儿"/"小三"/"三哥", "李医生"/"王老师"
  
  ## Rule 4: Timeline Judgment
  **Prefer states from the current narrative timeline.** Pay attention to time indicator words such as "recall", "remember", "past", "back then", etc. Apply the memory filter per character:
  - A character who ALSO appears in the current timeline: ignore their memory/flashback states, use the current-timeline state (an adult's childhood flashback must not overwrite their present appearance).
  - A character who ONLY appears inside memory/flashback (never in the current timeline) and speaks or is described there: that memory state is their sole canonical state — extract it normally, including appearance/body/clothing. Never leave such a character with empty variants just because the evidence lives inside a recollection.
  - Example: in a chapter where the protagonist recalls his childhood, his own childhood look is a flashback state and is ignored (his present adult state wins); but his parents, who appear only in that memory and speak there, are extracted from the memory — the father shown "in a wheelchair, weathered face, hair mostly turned gray" yields those body features.
  - **Memory annotation (required)**: when you extract a memory-only character, the top-level `info` and every variant/combination `info` for that character MUST state that the information comes from a memory/recollection (e.g. "回忆中的父亲……" / "In a memory, ..."). Downstream depends on this marker to know the evidence is from a flashback, not the present scene.
  - **Age and body of memory-only characters (be careful)**:
    * A single memory can span several years (e.g. the father is first an abusive drunk during childhood, later disabled and in a wheelchair). Do NOT blend two clearly different physical states into one variant. If the memory shows the same character at two visually distinct life stages, split into separate whole_body variants following the normal outward-appearance split rule.
    * Choose `age` / `apparent_age` / `age_category` to match the LIFE STAGE actually shown in the memory, not the character's age at the present moment of the story. If the memory only implies a life stage ("middle-aged", "an old man") without a number, fill `age_category` from that and leave `age`/`apparent_age` empty rather than inventing a number.
    * Extract body/appearance details exactly as the memory describes them (wheelchair use → body_description, "hair mostly turned gray" → hair_color, "weathered face" → facial_description). Follow the normal facial/body rules: keep inherent visible features, drop transient emotional states.
    * If the memory gives no usable body detail at all, leave those fields empty (the deduplication stage will reconstruct a minimal variant); never fabricate specifics that the memory does not support.

  ## Rule 5: Field Description Specification Rules
  When extracting features, follow these specific description rules:
  
  ### outfit_discription field:
  - Avoid using placeholders like "not specifically described", "not detailed", "not described", "not mentioned"
  - If the description is "not specifically described, but pays attention to appearance", change to "pays attention to appearance"
  - If just "not specifically described", "not detailed", or other invalid descriptions, use empty string ("")
  - Avoid using time series descriptions (such as "early → middle → late"), each clothing variant should describe a single state, not including time changes
  - Avoid using overly general descriptions like "ordinary clothes", should infer more specific description based on context or use empty string
  
  ### skin_color field:
  - Avoid using invalid descriptions like "ordinary"
  - If no specific description, use empty string ("")
  
  ### body_type field:
  - Avoid using invalid descriptions like "ordinary"
  - If no specific description, use empty string ("")
  
  ### body_description field:
  - Must only describe body features (such as body type, muscles, bones, etc.)
  - Must not include scene action descriptions (such as "throat held by folding knife")
  - Must not include clothing descriptions (such as "wearing custom haute couture suit")
  
  ### Overall description:
  - Avoid using expressions like "not described in detail, but is..."
  - Directly describe features (e.g., "not described in detail, but is successful businessman image" should be changed to "businessman image")
  
  ## Rule 6: Empty Field Handling
  If a feature is unknown or not mentioned, use empty string (""), do not use "unknown" or other placeholders.
