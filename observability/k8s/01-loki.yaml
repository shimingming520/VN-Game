apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: agent-platform
data:
  loki.yaml: |
    auth_enabled: false

    analytics:
      reporting_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      instance_addr: 127.0.0.1
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # 6 个 Vector 会并行回放磁盘缓冲；默认 4 MiB/s 会持续返回 429/写入失败。
      ingestion_rate_mb: 32
      ingestion_burst_size_mb: 64
      per_stream_rate_limit: 8MB
      per_stream_rate_limit_burst: 16MB
      retention_period: 336h
      max_query_lookback: 336h
      query_timeout: 30s
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki-hot/tsdb-index
        cache_location: /var/loki-hot/tsdb-cache

    ingester:
      wal:
        enabled: true
        dir: /var/loki-hot/wal
        # Pod 正常替换前先把已确认的日志刷入持久化 chunks，避免 emptyDir 随 Pod 删除而丢失。
        flush_on_shutdown: true

    compactor:
      working_directory: /var/loki-hot/compactor
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 4
      delete_request_store: filesystem

    frontend:
      log_queries_longer_than: 5s

    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 128

    querier:
      max_concurrent: 4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: agent-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: storage-nfs
  resources:
    requests:
      # storage-nfs 当前不能在线扩容，所以首次即预留 50Gi。
      # Loki 同时启用 14 天 retention，避免日志无界增长。
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: agent-platform
  labels:
    app: loki
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      annotations:
        observability.farmmx.com/config-version: "2026-08-19-ingestion-32mb"
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: loki
          image: grafana/loki:3.6.12
          imagePullPolicy: IfNotPresent
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /var/loki
            - name: hot
              mountPath: /var/loki-hot
            - name: tmp
              mountPath: /tmp
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data
        - name: hot
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: agent-platform
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
    - name: grpc
      port: 9096
      targetPort: grpc
