# SPA history 路由 + /api 反代到集群内 platform-api Service
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前端路由用的是 createWebHistory,刷新非根路径需要 fallback 到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代到 game-platform 后端(同 namespace 内 Service:platform-api:8000)
    # 后端路由本身带 /api 前缀,这里不做路径改写,原样转发
    location /api/ {
        # 30 本、每本约 50 万字的 multipart 请求按 UTF-8 和表单开销预留余量。
        # 外层 Ingress 也必须保持同一上限,否则请求会在到达这里之前被拒绝。
        client_max_body_size 80m;
        client_body_timeout 300s;
        proxy_pass http://platform-api:8000;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
