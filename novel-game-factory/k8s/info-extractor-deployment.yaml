apiVersion: apps/v1
kind: Deployment
metadata:
  name: info-extractor
  namespace: novel-game
spec:
  replicas: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: info-extractor
  template:
    metadata:
      labels:
        app: info-extractor
    spec:
      terminationGracePeriodSeconds: 172800
      imagePullSecrets:
        - name: harbor-secret
      containers:
        - name: info-extractor
          image: harbor.farmmx.com/game/info_extractor:latest
          imagePullPolicy: Always
          command: ["celery"]
          args:
            - "-A"
            - "tasks"
            - "worker"
            - "--loglevel=info"
            - "-Q"
            - "extract_queue"
            - "--pool=prefork"
            - "--concurrency=1"
            - "--prefetch-multiplier=1"
            - "--max-tasks-per-child=5"
            - "--without-gossip"
            - "--without-mingle"
          envFrom:
            - configMapRef:
                name: novel-game-config-test
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: novel-game-secret-test
                  key: DB_PASSWORD
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novel-game-secret-test
                  key: DASHSCOPE_API_KEY
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novel-game-secret-test
                  key: DEEPSEEK_API_KEY
            - name: GPT_IMAGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: novel-game-secret-test
                  key: GPT_IMAGE_API_KEY
            - name: WORKER_DB_POOL_SIZE
              value: "1"
            - name: WORKER_DB_MAX_OVERFLOW
              value: "0"
          volumeMounts:
            - name: storage
              mountPath: /storage
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "3Gi"
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: novel-game-storage
