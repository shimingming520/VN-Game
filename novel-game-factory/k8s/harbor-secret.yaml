# 创建 Harbor 镜像拉取凭证
# 也可以用命令直接创建（推荐，不用把密码写进文件）：
# kubectl create secret docker-registry harbor-secret \
#   --docker-server=harbor.farmmx.com \
#   --docker-username=<你的用户名> \
#   --docker-password=<你的密码> \
#   -n novel-game
apiVersion: v1
kind: Secret
metadata:
  name: harbor-secret
  namespace: novel-game
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: <base64编码的docker con
  fig，用上方命令代替>
