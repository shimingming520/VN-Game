# Kuboard 单文件导入版。
# 导入前必须修改下面的 admin-password；不要把真实密码提交到 Git。
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: agent-platform
type: Opaque
stringData:
  admin-user: admin
  admin-password: "Juzhenpro@2026"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: agent-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: novel-game-vector-logs
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - nodes
  - pods
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: novel-game-vector-logs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: novel-game-vector-logs
subjects:
- kind: ServiceAccount
  name: vector
  namespace: agent-platform
---
apiVersion: v1
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: pressure-test
        orgId: 1
        folder: Pressure Test
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/dashboards
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: agent-platform
---
apiVersion: v1
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.agent-platform.svc.cluster.local:3100
        isDefault: true
        editable: false
        jsonData:
          maxLines: 1000
