  name: scene_extractor_safe_user
  version: v1.0
  language: en-US
  description: "场景提取器用户提示词模板（安全版）- 包含 {scene_id} 和 {context_text} 两个占位符，传入场景切片ID和对应剧情对话"
  tags:
    - scene-extraction
    - image-prompt
    - background
    - user-prompt
