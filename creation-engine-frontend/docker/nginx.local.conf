server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 80m;
        client_body_timeout 300s;
        # Resolve the Docker service on demand so API container restarts do not
        # leave this long-running frontend container pointing at a stale IP.
        set $api_gateway_upstream api_gateway:8000;
        proxy_pass http://$api_gateway_upstream;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
